server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;

    include /etc/nginx/mime.types;

    types {
        application/javascript mjs;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    location /api/ {
        # API_ORIGIN is substituted when the container starts. It defaults to
        # the local Compose backend and can point at the deployed site root
        # when a local web container should read the deployed canonical feed.
        proxy_pass ${API_ORIGIN}/api/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # The Vite build is published under /roadsense/ but its files live at the
    # nginx document root. Rewrite the base prefix before resolving static files.
    location = /roadsense {
        return 308 /roadsense/$is_args$args;
    }

    location /roadsense/ {
        rewrite ^/roadsense/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
