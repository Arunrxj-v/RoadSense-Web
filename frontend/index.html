<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf9f5" />
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('roadsense-theme')
          var theme = stored === 'dark' || stored === 'light' ? stored : 'light'
          var root = document.documentElement
          root.dataset.theme = theme
          root.style.colorScheme = theme
          var themeColor = document.querySelector('meta[name="theme-color"]')
          if (themeColor) {
            themeColor.setAttribute('content', theme === 'dark' ? '#111318' : '#faf9f5')
          }
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <title>RoadSense — Public road condition map</title>
    <meta
      name="description"
      content="Explore potholes recorded by RoadSense road-monitoring vehicles across Kerala. Search by PIN code and view canonical road condition observations."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="RoadSense — Public road condition map" />
    <meta
      property="og:description"
      content="A public map of potholes observed by RoadSense-equipped vehicles. Search by PIN code and inspect road condition records."
    />
    <meta property="og:site_name" content="RoadSense Vision" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400..600,0,0&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>RoadSense requires JavaScript to display the road condition map.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
