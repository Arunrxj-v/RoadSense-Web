name: roadsense

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: roadsense
      POSTGRES_USER: roadsense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - roadsense_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadsense -d roadsense"]
      interval: 5s
      timeout: 5s
      retries: 20
    # The database is only reachable on the internal Compose network.
    expose:
      - "5432"

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://roadsense:${POSTGRES_PASSWORD}@db:5432/roadsense
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://100.104.179.69:5173,http://localhost:5174,http://127.0.0.1:5174,http://100.104.179.69:5174,http://localhost:8091,http://127.0.0.1:8091,http://100.104.179.69:8091}
      AUTO_INIT_DB: "false"
      RUN_DB_INIT: "true"
      INGEST_API_KEY: ${INGEST_API_KEY:?set INGEST_API_KEY in .env}
      GEOCODING_USER_AGENT: ${GEOCODING_USER_AGENT:-RoadSenseVision/2.0 (public road condition map)}
      DEDUPE_RADIUS_M: ${DEDUPE_RADIUS_M:-25}
      DEDUPE_WINDOW_DAYS: ${DEDUPE_WINDOW_DAYS:-45}
      ROAD_MATCH_RADIUS_M: ${ROAD_MATCH_RADIUS_M:-30}
    depends_on:
      db:
        condition: service_healthy
    # Expose only the Flask API, never PostgreSQL. Set API_BIND_ADDRESS to the
    # Tailscale/LAN interface and keep the host firewall closed to the internet
    # unless the read API is intentionally public.
    ports:
      - "${API_BIND_ADDRESS:-0.0.0.0}:${API_PORT:-5001}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    expose:
      - "5000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://100.104.179.69:5001/api/v1}
        VITE_MAP_PROVIDER: ${VITE_MAP_PROVIDER:-}
        VITE_MAPTILER_API_KEY: ${VITE_MAPTILER_API_KEY:-}
        VITE_MAPTILER_STYLE_URL: ${VITE_MAPTILER_STYLE_URL:-}
        VITE_STADIA_API_KEY: ${VITE_STADIA_API_KEY:-}
        VITE_STADIA_STYLE_URL: ${VITE_STADIA_STYLE_URL:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-8091}:80"

volumes:
  roadsense_pgdata:
